# =============================================================================
#  Prometheus scrape config for the local docker-compose stack.
#
#  Loaded by the `prometheus` service (docker-compose.yml) when the
#  `observability` profile is active:
#
#      docker compose --profile observability up -d
#
#  Prometheus reaches the API on the docker network using the service name
#  `jit-hints-api:42069`. Outside docker the port is published on the host as
#  42069, so a local prom you run yourself can target `host.docker.internal`
#  or `127.0.0.1:42069` instead.
# =============================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: filler-sdk-local

scrape_configs:
  - job_name: jit-hints
    metrics_path: /metrics
    static_configs:
      - targets:
          - jit-hints-api:42069
        labels:
          service: jit-hints
          role: api
