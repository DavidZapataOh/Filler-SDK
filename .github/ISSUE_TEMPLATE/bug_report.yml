name: Bug report
description: Report a bug in Filler SDK packages, contracts, or CLI
title: '[Bug]: '
labels: [bug, triage]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please be specific — vague reports take
        longer to address. For security issues, **do not file a public issue**.
        Email: security@filler-sdk.xyz (see SECURITY.md).

  - type: textarea
    id: describe
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: To reproduce
      description: Minimal reproduction steps. Include code snippets / commands.
      placeholder: |
        1. `npx create-filler my-bot --vertical simple-jit`
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Filler SDK version
      placeholder: '@filler-sdk/sdk@0.1.0'
    validations:
      required: true

  - type: dropdown
    id: chain
    attributes:
      label: Chain (if relevant)
      options:
        - Not chain-specific
        - Ethereum mainnet
        - Unichain
        - Sepolia / Unichain Sepolia
        - Arbitrum
        - Base
        - Optimism
        - Other (mention in description)

  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Node version, Bun version, Foundry version
      placeholder: |
        macOS 14.x / Node 22.x / Bun 1.1.x / Foundry 1.5.x
