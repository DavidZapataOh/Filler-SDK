## Echidna configuration for `EchidnaBond` properties.
## Run with:
##   echidna test/echidna/EchidnaFiller.sol --contract EchidnaBond --config echidna.yaml

testMode: property
testLimit: 1000000
seqLen: 100
shrinkLimit: 5000
coverage: true
corpusDir: test/echidna/corpus
multi-abi: true
seed: 0x42

## Solidity compilation settings — must match `foundry.toml`'s `[profile.default]`:
solcArgs: "--via-ir --optimize --optimize-runs 1000000 --evm-version prague"

## Crytic compilation: pass remappings + framework hint.
cryticArgs:
  - "--solc-remaps"
  - "forge-std=lib/forge-std/src solady=lib/solady/src @uniswap/v4-core=lib/v4-core/src @uniswap/v4-periphery=lib/v4-periphery/src @uniswap/uniswapx=lib/UniswapX/src @uniswap/permit2=lib/permit2/src permit2=lib/permit2/src"
  - "--compile-force-framework"
  - "foundry"

## Initial balance for the test contract — needed because EchidnaBond's `stakeForA / stakeForB`
## payable wrappers require funds to forward.
balanceContract: 1000000000000000000000  # 1000 ether
